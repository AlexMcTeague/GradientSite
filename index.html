<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <form onsubmit="return false;">
                <div>
                    <label for="firstColor">Start Color:</label>
                    <input type="color" id="firstColor" name="firstColor" value="#ff0000">

                    <label for="inputMessage">Message:</label>
                    <input type="text" id="inputMessage" name="inputMessage" placeholder="Your message here...">

                    <label for="lastColor">End Color:</label>
                    <input type="color" id="lastColor" name="lastColor" value="#00ff00">
                </div>
                <div>
                    <h4>Result:</h4>
                    <h3 id="result">
                        
                    </h3>
                </div>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
